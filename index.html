<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Buyer</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet" />
    <link href="./style.css" rel="stylesheet" />
    <link href="./fonts.css" rel="stylesheet">

    <link href="./css/bootstrap-icons.css" rel="stylesheet">
  </head>
  <body>
    <div class="main-container">
      <h3 class="title"><i class="bi bi-truck-front-fill"></i> Auto Buyer</h3>
  
      <div class="form-group">
        <label class="form-label" for="auctionSelect">Auction Type</label>
        <i class="bi bi-clipboard-check"></i>
        <select class="form-select" id="auctionSelect">
          <option selected disabled>Select Auction Type</option>
        </select>
      </div>
  
      <div class="form-group">
        <label class="form-label" for="locationSelect">Location</label>
        <i class="bi bi-geo-alt-fill"></i>
        <select class="form-select" id="locationSelect">
          <option selected disabled>Select Location</option>
        </select>
      </div>
      <h1 class="price" id="priceDisplay">Qiyməti görmək üçün seçim edin</h1>

      <br><br><br><br>
      <h1 class="poti-highlight"><i class="bi bi-geo-alt"></i> POTI</h1>

    </div>
  
  


    <script src="./style.js"></script>
    <script src="./js/bootstrap.bundle.min.js" ></script>
    <script src="./js/xlsx.full.min.js"></script>
  </body>
</html>
